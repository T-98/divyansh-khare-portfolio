<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Voice claims agent pipeline: Vapi telephony into a FastAPI endpoint, a LangGraph auth loop and router fanning out to claim, FAQ and escalation specialists over Supabase and an embedded FAQ corpus">
  <defs>
    <linearGradient id="vc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="vc-glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#52a8ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#52a8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="vc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e6e6e"/>
    </marker>
    <marker id="vc-arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52a8ff" fill-opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="url(#vc-sky)"/>
  <rect width="1200" height="640" fill="url(#vc-grid)"/>
  <rect width="1200" height="640" fill="url(#vc-glow)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Geist', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="600" y="86" font-size="17" fill="#c9c9c9" letter-spacing="0.4">the model proposes · the code disposes</text>
    <text x="600" y="114" font-size="13.5" fill="#f87171" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, monospace" letter-spacing="0.2">no tool takes a customer_id the model can fill in</text>
  </g>

  <!-- vapi -->
  <g>
    <rect x="60" y="252" width="150" height="96" rx="12" fill="#111111" stroke="#ffffff" stroke-opacity="0.32"/>
    <text x="135" y="292" text-anchor="middle" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, monospace" font-size="16" fill="#52a8ff">vapi</text>
    <text x="135" y="314" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" font-size="11.5" fill="#8f8f8f">phone · stt · tts</text>
  </g>
  <line x1="210" y1="300" x2="248" y2="300" stroke="#6e6e6e" stroke-width="1.4" marker-end="url(#vc-arrow)"/>

  <!-- fastapi -->
  <g>
    <rect x="250" y="252" width="178" height="96" rx="12" fill="#111111" stroke="#ffffff" stroke-opacity="0.32"/>
    <text x="339" y="288" text-anchor="middle" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, monospace" font-size="16" fill="#34d399">fastapi</text>
    <text x="339" y="308" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" font-size="11.5" fill="#8f8f8f">0.4s debounce</text>
    <text x="339" y="326" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" font-size="11.5" fill="#8f8f8f">one lock per call_id</text>
  </g>
  <line x1="428" y1="300" x2="458" y2="300" stroke="#6e6e6e" stroke-width="1.4" marker-end="url(#vc-arrow)"/>

  <!-- langgraph container -->
  <rect x="460" y="175" width="430" height="250" rx="16" fill="#0f0f0f" stroke="#52a8ff" stroke-opacity="0.32" stroke-dasharray="5 5"/>
  <text x="484" y="203" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, monospace" font-size="12" fill="#52a8ff" letter-spacing="1.4">LANGGRAPH</text>

  <!-- auth loop -->
  <g>
    <rect x="484" y="220" width="180" height="64" rx="10" fill="#141414" stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="574" y="246" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" font-size="14" fill="#e8e8e8">auth loop</text>
    <text x="574" y="266" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" font-size="11" fill="#8f8f8f">readback · 3 tries · ceilings</text>
  </g>
  <line x1="664" y1="252" x2="684" y2="252" stroke="#6e6e6e" stroke-width="1.4" marker-end="url(#vc-arrow)"/>

  <!-- router -->
  <g>
    <rect x="686" y="220" width="180" height="64" rx="10" fill="#141414" stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="776" y="246" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" font-size="14" fill="#e8e8e8">router</text>
    <text x="776" y="266" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" font-size="11" fill="#8f8f8f">keywords → model fallback</text>
  </g>

  <!-- router fan-out -->
  <g stroke="#52a8ff" stroke-opacity="0.55" stroke-width="1.3" fill="none">
    <path d="M776 284 V306"/>
    <path d="M544 306 H806"/>
    <path d="M544 306 V328" marker-end="url(#vc-arrow-b)"/>
    <path d="M675 306 V328" marker-end="url(#vc-arrow-b)"/>
    <path d="M806 306 V328" marker-end="url(#vc-arrow-b)"/>
  </g>

  <!-- specialists -->
  <g font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" text-anchor="middle">
    <rect x="484" y="332" width="120" height="50" rx="9" fill="#141414" stroke="#52a8ff" stroke-opacity="0.4"/>
    <text x="544" y="354" font-size="13" fill="#e8e8e8">claim</text>
    <text x="544" y="371" font-size="10.5" fill="#8f8f8f">injected args</text>

    <rect x="620" y="332" width="110" height="50" rx="9" fill="#141414" stroke="#52a8ff" stroke-opacity="0.4"/>
    <text x="675" y="354" font-size="13" fill="#e8e8e8">faq</text>
    <text x="675" y="371" font-size="10.5" fill="#8f8f8f">grounded</text>

    <rect x="746" y="332" width="120" height="50" rx="9" fill="#141414" stroke="#52a8ff" stroke-opacity="0.4"/>
    <text x="806" y="354" font-size="13" fill="#e8e8e8">escalate</text>
    <text x="806" y="371" font-size="10.5" fill="#8f8f8f">no tools</text>
  </g>

  <!-- data sources -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="4 5" fill="none">
    <path d="M544 382 V470"/>
    <path d="M675 382 V470"/>
  </g>

  <rect x="536" y="396" width="278" height="19" fill="#0f0f0f"/>
  <text x="675" y="410" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" font-size="11.5" fill="#6e6e6e">agent node speaks · tool node writes state</text>
  <g font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" text-anchor="middle">
    <rect x="470" y="470" width="175" height="56" rx="10" fill="#111111" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="557.5" y="493" font-size="12.5" fill="#c9c9c9">supabase</text>
    <text x="557.5" y="511" font-size="10.5" fill="#7a7a7a">customers · claims</text>

    <rect x="660" y="470" width="180" height="56" rx="10" fill="#111111" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="750" y="493" font-size="12.5" fill="#c9c9c9">faq corpus</text>
    <text x="750" y="511" font-size="10.5" fill="#7a7a7a">20 sections · embedded</text>
  </g>

  <!-- post-call record -->
  <line x1="890" y1="300" x2="918" y2="300" stroke="#6e6e6e" stroke-width="1.4" marker-end="url(#vc-arrow)"/>
  <g>
    <rect x="920" y="252" width="220" height="96" rx="12" fill="#111111" stroke="#ffffff" stroke-opacity="0.32"/>
    <text x="1030" y="288" text-anchor="middle" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, monospace" font-size="15" fill="#34d399">airtable record</text>
    <text x="1030" y="308" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" font-size="11.5" fill="#8f8f8f">one gpt-5 pass, one upsert</text>
    <text x="1030" y="326" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Geist', sans-serif" font-size="11.5" fill="#8f8f8f">off the caller path</text>
  </g>

  <!-- label pill -->
  <g>
    <rect x="40" y="568" width="322" height="32" rx="16" fill="#111111" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="62" y="589" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, monospace" font-size="12.5" fill="#8f8f8f" letter-spacing="1.8">VOICE CLAIMS AGENT · LANGGRAPH</text>
  </g>
</svg>
